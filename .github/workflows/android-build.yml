name: Android Build

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Export GOOGLE_SERVICES_JSON
        run: |
          echo "GOOGLE_SERVICES_JSON=${{ secrets.GOOGLE_SERVICES_JSON }}" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13

      - name: Build Release APKs
        env:
          SKETCHUB_API_KEY: ${{ secrets.SKETCHUB_API_KEY }}
        run: gradle assembleRelease

      - name: Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
             app/build/outputs/apk/release/app-v7a-${{ steps.set_sha.outputs.short_sha }}.apk

          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk \
             app/build/outputs/apk/release/app-v8a-${{ steps.set_sha.outputs.short_sha }}.apk

          mv app/build/outputs/apk/release/app-universal-release.apk \
             app/build/outputs/apk/release/app-universal-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload APK v7a
        uses: actions/upload-artifact@v4
        with:
          name: apk-v7a-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-v7a-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload APK v8a
        uses: actions/upload-artifact@v4
        with:
          name: apk-v8a-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-v8a-${{ steps.set_sha.outputs.short_sha }}.apk

      - name: Upload APK universal
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-universal-${{ steps.set_sha.outputs.short_sha }}.apk
